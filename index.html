<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Municipal Eye View — Investment Agentic AI</title>
    <meta
      name="description"
      content="Map-centric Investment Agentic AI prototype for assessing Dubai Municipality plots: asset intelligence, market analysis, Highest & Best Use, structuring, financial feasibility, recommendation and portfolio capture."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/logo.svg" alt="" width="28" height="28" />
        <div>
          <div class="brand-name">Municipal Eye View</div>
          <div class="brand-sub">Investment Agentic AI · DM plot assessment prototype</div>
        </div>
      </div>
      <form class="plot-search" id="plot-search" autocomplete="off" role="search">
        <label for="plot-input" class="sr-only">DM plot number</label>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M10 2a8 8 0 016.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1110 2zm0 2a6 6 0 100 12 6 6 0 000-12z" />
        </svg>
        <input id="plot-input" list="plot-options" placeholder="Enter DM plot number, e.g. 421-0318" />
        <datalist id="plot-options"></datalist>
        <button type="submit" class="btn btn-primary">Locate plot</button>
      </form>
      <div class="top-actions">
        <span class="llm-pill" id="llm-pill" title="Conversational assistant mode">Assistant: checking…</span>
        <button type="button" class="btn btn-ghost" data-action="library">Evidence library</button>
        <button type="button" class="btn btn-ghost" data-action="legend">Legend</button>
        <button type="button" class="btn btn-opp" data-action="open-opps">Opportunities</button>
        <button type="button" class="btn btn-cap" data-action="open-cap">Portfolio (CAP) <span class="count" id="cap-count">0</span></button>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Investment journey"></nav>

    <main class="workspace">
      <section class="map-area" aria-label="Interactive investment map">
        <div id="map" class="map"></div>
        <aside class="agents-panel" id="agents" aria-label="Agent activity"></aside>
        <div class="layer-panel" id="layers"></div>
        <aside class="chat" id="chat" aria-label="Investment assistant"></aside>
      </section>
      <section class="dashboard" id="dashboard" aria-live="polite"></section>
    </main>

    <aside class="drawer" id="evidence" aria-label="Evidence" hidden></aside>
    <div class="overlay" id="cap" hidden></div>
    <div class="overlay" id="opps" hidden></div>
    <div class="modal" id="legend" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
