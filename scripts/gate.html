<title>God’s Eye View</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --ground: #0b1119;
    --panel: #111a25;
    --line: #243244;
    --grid: #121b27;
    --ink: #e6edf5;
    --muted: #8b9cb1;
    --accent: #3d8ce8;
    --accent-ink: #ffffff;
    --error: #ee7b7b;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html,
  body {
    height: 100%;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: -1px -1px;
  }
  .wrap {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding-block: 32px;
  }
  .gate {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px 24px;
    display: grid;
    gap: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand svg {
    flex: none;
  }
  .brand b {
    display: block;
    font-weight: 600;
    font-size: 17px;
  }
  .brand span {
    color: var(--muted);
    font-size: 13px;
  }
  h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 600;
    text-wrap: balance;
  }
  p {
    margin: 0;
    color: var(--muted);
  }
  form {
    display: grid;
    gap: 10px;
  }
  label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input[type='password'],
  input[type='text'] {
    font: 500 16px var(--mono);
    letter-spacing: 0.06em;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    width: 100%;
    box-sizing: border-box;
  }
  input:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
  }
  .row label {
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    font: 600 15px var(--sans);
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
  }
  button[disabled] {
    opacity: 0.6;
    cursor: progress;
  }
  .toggle {
    background: none;
    color: var(--muted);
    font-weight: 500;
    font-size: 13px;
    padding: 0;
  }
  .msg {
    min-height: 1.5em;
    font-size: 13px;
  }
  .msg.err {
    color: var(--error);
  }
  .foot {
    border-top: 1px solid var(--line);
    padding-top: 14px;
    font: 12px var(--mono);
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  @media (prefers-reduced-motion: no-preference) {
    .gate {
      animation: rise 0.35s ease-out both;
    }
    @keyframes rise {
      from {
        transform: translateY(6px);
      }
    }
  }
</style>

<div class="wrap">
  <main class="gate">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="16" fill="none" stroke="#3d8ce8" stroke-width="2" />
        <path d="M6 18c3.5-5 7.6-7.5 12-7.5S26.5 13 30 18c-3.5 5-7.6 7.5-12 7.5S9.5 23 6 18z" fill="none" stroke="#e6edf5" stroke-width="1.6" />
        <circle cx="18" cy="18" r="3.4" fill="#3d8ce8" />
      </svg>
      <div><b>God’s Eye View</b><span>Investment Agentic AI · DM plot assessment prototype</span></div>
    </div>
    <h1>Enter the access password</h1>
    <p>This prototype is shared privately. The page stays encrypted until the password is entered.</p>
    <form id="gate-form" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required />
      <div class="row">
        <label for="remember"><input id="remember" type="checkbox" /> Keep me signed in on this device</label>
        <button type="button" class="toggle" id="show" aria-controls="pw">Show</button>
      </div>
      <button id="go" type="submit">Open the platform</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <div class="foot"><span>Plots 421-0318 · 326-0914</span><span>25.20° N 55.37° E</span></div>
  </main>
</div>

<script>
  (() => {
    const SALT = '__SALT__';
    const IV = '__IV__';
    const ITER = __ITER__;
    const DATA = '__DATA__';
    const STORE = 'gev-access-key';
    const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const $ = (id) => document.getElementById(id);
    const form = $('gate-form');
    const pw = $('pw');
    const msg = $('msg');
    const go = $('go');

    const store = {
      get: () => {
        try {
          return localStorage.getItem(STORE);
        } catch {
          return null;
        }
      },
      set: (v) => {
        try {
          localStorage.setItem(STORE, v);
        } catch {}
      },
      clear: () => {
        try {
          localStorage.removeItem(STORE);
        } catch {}
      },
    };

    async function deriveRaw(password) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
    }

    async function open(raw) {
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
      const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      document.open();
      document.write(html);
      document.close();
    }

    const toB64 = (u8) => btoa(String.fromCharCode(...u8));

    $('show').addEventListener('click', () => {
      const hidden = pw.type === 'password';
      pw.type = hidden ? 'text' : 'password';
      $('show').textContent = hidden ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = pw.value.trim().toUpperCase();
      if (!value) return;
      go.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Checking…';
      try {
        const raw = await deriveRaw(value);
        if ($('remember').checked) store.set(toB64(raw));
        await open(raw);
      } catch {
        go.disabled = false;
        msg.className = 'msg err';
        msg.textContent = 'That password is not right. Check it and try again; letters are not case-sensitive.';
        pw.select();
      }
    });

    const saved = store.get();
    if (saved) {
      msg.textContent = 'Opening…';
      open(bytes(saved)).catch(() => {
        store.clear();
        msg.textContent = '';
      });
    } else {
      pw.focus();
    }
  })();
</script>
